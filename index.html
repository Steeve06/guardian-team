<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EJ Fourth Trimester Guardian | Team</title>
  <meta name="description" content="Meet the KSU capstone team behind EJ Fourth Trimester Guardian: roles, graduation dates, internship goals and how to reach us.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #14213D; --cog: #9A4A1F; --bg: #FAF6F0; --card: #FFFFFF;
      --ink: #1F2430; --muted: #5B6270; --line: #E4DCCF; --green: #2E6B4F;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 "Source Sans 3", system-ui, sans-serif; }
    h1, h2, h3 { font-family: "Source Serif 4", Georgia, serif; color: var(--navy); line-height: 1.2; margin: 0; }
    a { color: var(--cog); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--cog); outline-offset: 2px; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    header.hero { background: var(--navy); color: #fff; padding: 56px 0 48px; }
    .hero .eyebrow { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; color: #F0C8A8; }
    .hero h1 { color: #fff; font-size: clamp(32px, 5vw, 52px); margin: 10px 0 12px; }
    .hero p { max-width: 720px; margin: 0; font-size: 19px; color: #DDE3F0; }
    .hero nav { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
    .hero nav a { color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 10px 18px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
    .hero nav a:hover { background: rgba(255,255,255,.1); }

    section { padding: 56px 0 8px; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .section-head h2 { font-size: 32px; }
    .section-head p { margin: 0; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .person { display: flex; gap: 16px; align-items: center; }
    .avatar { width: 88px; height: 88px; border-radius: 50%; flex: none; object-fit: cover; background: var(--navy); color: #fff; display: grid; place-items: center; font: 700 30px "Source Serif 4", Georgia, serif; }
    .person h3 { font-size: 22px; }
    .role { color: var(--cog); font-weight: 700; margin-top: 2px; }
    .badge { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--green); border: 1px solid var(--green); border-radius: 999px; padding: 2px 10px; }
    dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; }
    dt { color: var(--muted); font-weight: 600; }
    dd { margin: 0; }
    .about { margin: 0; }
    .projects h4 { margin: 0 0 6px; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .projects ul { margin: 0; padding-left: 18px; }
    .projects li + li { margin-top: 6px; }
    .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
    .links a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--navy); color: var(--navy); text-decoration: none; font-weight: 600; }
    .links a.primary { background: var(--navy); color: #fff; }
    .links svg { width: 18px; height: 18px; }

    .project { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .project .card p { margin: 0; }
    .facts dl { grid-template-columns: 1fr; gap: 2px; }
    .facts dd { margin-bottom: 10px; }

    footer { margin-top: 56px; padding: 28px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }
    @media (max-width: 760px) { .project { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="eyebrow" id="event"></div>
      <h1 id="title"></h1>
      <p id="tagline"></p>
      <nav aria-label="Page sections">
        <a href="#team">Meet the team</a>
        <a href="#project">About the project</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="team" aria-labelledby="team-h">
      <div class="section-head">
        <h2 id="team-h">Meet the team</h2>
        <p>Software engineering capstone, Kennesaw State University</p>
      </div>
      <div class="grid" id="team-grid"></div>
    </section>

    <section id="project" aria-labelledby="project-h">
      <div class="section-head"><h2 id="project-h">About the project</h2></div>
      <div class="project">
        <div class="card"><p id="summary"></p></div>
        <div class="card facts"><dl id="facts"></dl></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap" id="footer"></div>
  </footer>

  <script src="team.js"></script>
  <script>
    const el = (tag, attrs = {}, ...kids) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") n.className = v; else n.setAttribute(k, v);
      }
      for (const k of kids) if (k != null && k !== "") n.append(k);
      return n;
    };
    const svg = (path) => {
      const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none");
      s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2");
      s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
      s.setAttribute("aria-hidden", "true");
      s.innerHTML = path; return s;
    };
    const ICON = {
      mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
      link: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 014 0v4M12 10v7"/>',
      code: '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>',
    };
    const initials = (name) => name.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const safeUrl = (u) => /^(https?:|mailto:)/i.test(u) ? u : "";

    // Header, project and footer
    document.title = `${PROJECT.title} | Team`;
    document.getElementById("event").textContent = [PROJECT.event, PROJECT.posterNumber && `Poster ${PROJECT.posterNumber}`].filter(Boolean).join(" · ");
    document.getElementById("title").textContent = PROJECT.title;
    document.getElementById("tagline").textContent = PROJECT.tagline;
    document.getElementById("summary").textContent = PROJECT.summary;
    const facts = document.getElementById("facts");
    [["Sponsor", PROJECT.sponsor], ["Advisor", PROJECT.advisor], ["School", PROJECT.school]].forEach(([k, v]) => {
      if (v) facts.append(el("dt", {}, k), el("dd", {}, v));
    });
    document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${PROJECT.title} team · ${PROJECT.school}`;

    // Team cards
    const grid = document.getElementById("team-grid");
    for (const p of TEAM) {
      const avatar = p.photo
        ? el("img", { class: "avatar", src: p.photo, alt: `Photo of ${p.name}` })
        : el("div", { class: "avatar", "aria-hidden": "true" }, initials(p.name));

      const who = el("div", {}, el("h3", {}, p.name), p.role ? el("div", { class: "role" }, p.role) : "",
        p.seekingInternship ? el("span", { class: "badge" }, "Open to internships") : "");

      const dl = el("dl");
      [["Major", p.major], ["Graduating", p.graduation], ["Internship", p.internshipNote], ["Dream job", p.dreamJob]]
        .forEach(([k, v]) => { if (v) dl.append(el("dt", {}, k), el("dd", {}, v)); });

      let projects = "";
      if (p.projects && p.projects.length) {
        const ul = el("ul");
        for (const pr of p.projects) {
          const url = safeUrl(pr.link || "");
          const name = url ? el("a", { href: url, target: "_blank", rel: "noopener" }, pr.name) : el("strong", {}, pr.name);
          ul.append(el("li", {}, name, pr.description ? ` — ${pr.description}` : ""));
        }
        projects = el("div", { class: "projects" }, el("h4", {}, "Projects"), ul);
      }

      const links = el("div", { class: "links" });
      if (p.email) { const a = el("a", { class: "primary", href: `mailto:${p.email}` }); a.append(svg(ICON.mail), "Email"); links.append(a); }
      if (safeUrl(p.linkedin)) { const a = el("a", { href: p.linkedin, target: "_blank", rel: "noopener" }); a.append(svg(ICON.link), "LinkedIn"); links.append(a); }
      if (safeUrl(p.github)) { const a = el("a", { href: p.github, target: "_blank", rel: "noopener" }); a.append(svg(ICON.code), "GitHub"); links.append(a); }

      grid.append(el("article", { class: "card", "aria-label": p.name },
        el("div", { class: "person" }, avatar, who),
        dl.childElementCount ? dl : "",
        p.about ? el("p", { class: "about" }, p.about) : "",
        projects,
        links.childElementCount ? links : ""));
    }
  </script>
</body>
</html>
